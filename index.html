<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060f;color:#cfe3ff;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 700px at 50% 30%, #0a1230, #02030a 70%);
  }
  canvas{
    display:block;height:100vh;width:auto;max-width:100vw;
    touch-action:none;image-rendering:pixelated;background:#04060f;
  }
  #hud{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;
    user-select:none;pointer-events:none;z-index:5;
  }
  .hud-box{
    background:rgba(5,10,30,.6);border:1px solid rgba(90,140,255,.25);
    padding:5px 12px;border-radius:10px;min-width:80px;text-align:center;backdrop-filter:blur(6px);
  }
  .hud-lbl{font-size:10px;color:#7aa0ff;letter-spacing:1px}
  .hud-val{font-size:17px;font-weight:700;color:#eaf2ff}
  .livedot{color:#ff5c7a}
  .livedot.lost{color:#2a3350}
  #overlay{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(4,8,24,.8);border:1px solid rgba(90,140,255,.3);border-radius:20px;
    padding:32px 38px;backdrop-filter:blur(10px);text-align:center;max-width:420px;
  }
  #overlay.show{display:flex}
  #overlay h1{font-size:36px;color:#8fd0ff;letter-spacing:6px;margin-bottom:10px;text-shadow:0 0 24px rgba(80,160,255,.6)}
  #overlay .sub{color:#8aa3d6;font-size:14px;margin-bottom:18px;line-height:1.9}
  #overlay .keys{font-size:12px;color:#6f87c0;margin-bottom:20px;line-height:2}
  .k{display:inline-block;min-width:24px;padding:2px 8px;margin:0 2px;border:1px solid #3b4a7a;border-radius:6px;background:#0c1230;color:#9fc0ff;font-size:12px}
  #overlay .score-final{font-size:22px;color:#ffd479;font-weight:700;margin-bottom:20px}
  #startBtn{
    font-size:16px;padding:12px 34px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#3aa0ff,#7a5cff);color:#fff;font-weight:700;letter-spacing:3px;
    box-shadow:0 8px 30px rgba(60,120,255,.4);transition:transform .15s;
  }
  #startBtn:hover{transform:scale(1.04)}
  #enhancePanel{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;
    display:none;flex-direction:column;align-items:center;gap:14px;
    background:rgba(6,12,34,.92);border:1px solid rgba(120,200,255,.4);border-radius:18px;
    padding:26px 22px;backdrop-filter:blur(8px);max-width:440px;
  }
  #enhancePanel.show{display:flex}
  #enhancePanel h2{font-size:20px;color:#8fd0ff;letter-spacing:4px;margin-bottom:4px}
  #enhancePanel .hint{font-size:12px;color:#6f87c0}
  .enhance-list{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .enhance-card{
    width:120px;padding:16px 10px;border-radius:12px;cursor:pointer;
    background:linear-gradient(160deg,#12204a,#0a1030);border:1px solid rgba(90,140,255,.35);
    transition:transform .12s, border-color .12s;
  }
  .enhance-card:hover{transform:translateY(-4px);border-color:#7ae0ff}
  .enhance-card .enhance-name{font-size:14px;font-weight:700;color:#eaf2ff;margin-bottom:6px}
  .enhance-card .enhance-desc{font-size:11px;color:#8aa3d6;line-height:1.5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="540" height="960"></canvas>

  <div id="hud">
    <div class="hud-box"><div class="hud-lbl">分数</div><div class="hud-val" id="score">0</div></div>
    <div class="hud-box"><div class="hud-lbl">最高</div><div class="hud-val" id="hiscore">0</div></div>
    <div class="hud-box"><div class="hud-lbl">生命</div><div class="hud-val" id="lives"></div></div>
    <div class="hud-box"><div class="hud-lbl">波次</div><div class="hud-val" id="wave">1</div></div>
    <div class="hud-box"><div class="hud-lbl">火力</div><div class="hud-val" id="fire">1</div></div>
    <div class="hud-box"><div class="hud-lbl">等级</div><div class="hud-val" id="level">1</div></div>
  </div>

  <div id="overlay">
    <h1 id="ovTitle">雷霆战机</h1>
    <div class="score-final" id="ovScore" style="display:none">得分 <span id="ovScoreVal">0</span></div>
    <div class="sub">击落敌机 · 躲避弹幕 · 突破波次<br>难度会越来越高</div>
    <div class="keys">
      <span class="k">A</span><span class="k">D</span><span class="k">W</span><span class="k">S</span> 或方向键移动
      <span class="k">空格</span> 射击<br>
      <span class="k">P</span> 暂停 · <span class="k">M</span> 静音 · 也能用鼠标控制
    </div>
    <button id="startBtn">开 始 游 戏</button>
  </div>

  <div id="enhancePanel">
    <h2>击 杀 25 · 选 择 增 强</h2>
    <div class="hint">每 25 次击杀可从池中随机 3 选 1，选择后恢复游戏</div>
    <div class="enhance-list" id="enhanceList"></div>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = 540, H = 960;

  // ---- 音效（合成，无文件）----
  let actx = null, muted = false;
  function initAudio(){ if(actx) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function tone(freq,dur,type,vol){
    if(muted||!actx) return;
    try{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type||'square'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  // ---- 常量 ----
  const P = { w:56, h:60, speed:300, fireCd:.14, bulletSpeed:820, lives:3, invincible:1.8 };

  // ---- 状态 ----
  let state='idle', player, bullets=[], ebullets=[], enemies=[], particles=[], stars=[], items=[], bombs=[];
  let score=0, hiscore, wave=1, waveTimer=20, spawnCd=.6, elapsed=0, keys={}, hitFlash=0, mouseDown=false;
  let fireLevel=1;            // 武器等级 1..5（成长升级提升上限）
  let shieldT=0;             // 护盾剩余秒数
  let itemCd=8;              // 道具掉落冷却（秒）
  let formationCd=12;        // 编队触发冷却（秒）
  let boss=null;             // Boss 引用
  let bossPendingWave=0;     // 该波结束时召唤 Boss
  let lastBossWave=0;        // 已刷过 Boss 的波次（防同波重刷）
  // ---- 成长系统 ----
  let playerLevel=0;         // 成长等级（每 10 击杀 +1）
  let killCount=0;           // 累计击杀计数
  let bulletDmgMul=1;       // 子弹伤害倍率 1+playerLevel*0.05
  let moveSpeedMul=1;       // 移动速度倍率 1+playerLevel*0.03
  let invMul=1;              // 无敌时间倍率 1-playerLevel*0.05（最低 .5）
  // ---- 3 选 1 随机增强（Roguelike）----
  let pierceLevel=0;         // 穿透子弹：子弹额外穿过的敌机数
  let splitLevel=0;         // 分裂子弹：每发分裂 2 斜弹的等级
  let laserLevel=0;         // 激光主炮：每 3 发追加 1 激光弹
  let lifestealPct=0;       // 吸血：击杀回 5% 分数奖励
  let extraLife=0;          // 护体装甲：额外生命
  let speedPlus=0;          // 急速闪避：移动速度 +40%（可叠加）
  let fireCdMul=1;          // 极速射击：fireCd -30%（可叠加）
  let laserCd=0;           // 激光主炮冷却
  let panelOpen=false;      // 3 选 1 面板是否开启
  hiscore = +(localStorage.getItem('tf.hiscore')||0);
  document.getElementById('hiscore').textContent = hiscore;

  function resetGame(){
    // 飞机停在画面正中（y=H/2），最显眼
    player = { x:W/2-P.w/2, y:H/2-P.h/2, w:P.w, h:P.h, cd:0, inv:0, angle:0, livesLeft:P.lives };
    bullets=[]; ebullets=[]; enemies=[]; particles=[]; items=[]; bombs=[];
    score=0; wave=1; waveTimer=20; spawnCd=.6; elapsed=0;
    fireLevel=1; shieldT=0; itemCd=6; formationCd=12;
    boss=null; bossPendingWave=0; lastBossWave=0;
    playerLevel=0; killCount=0; bulletDmgMul=1; moveSpeedMul=1; invMul=1;
    pierceLevel=0; splitLevel=0; laserLevel=0; lifestealPct=0;
    extraLife=0; speedPlus=0; fireCdMul=1; laserCd=0; panelOpen=false;
    stars=[];
    for(let i=0;i<110;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:1+Math.random()*2.4, v:50+Math.random()*280, b:.25+Math.random()*.7});
    updateLives();
  }

  // ---- HUD ----
  function updateLives(){
    const el=document.getElementById('lives');
    const left=player?player.livesLeft:P.lives+extraLife;
    const cap=P.lives+extraLife;
    el.innerHTML='';
    for(let i=0;i<cap;i++){
      const s=document.createElement('span');
      s.className='livedot'+(i<left?'':' lost');
      s.textContent='●';
      el.appendChild(s);
    }
  }
  function setHud(){
    document.getElementById('score').textContent=score;
    document.getElementById('wave').textContent=wave;
    document.getElementById('fire').textContent=fireLevel;
    document.getElementById('level').textContent=playerLevel+1;
  }

  // ---- 敌机 ----
  function spawnEnemy(){
    const roll=Math.random();
    let type='grunt';
    const waveBonus = Math.min(.4, wave*.03);
    if(roll>0.82-waveBonus) type='tank';
    else if(roll>0.62) type = Math.random()<0.5 ? 'weaver' : 'drone';
    else if(roll>0.55 && wave>=4) type='bomber';      // 轰炸机：波次>=4
    else if(roll>0.47 && wave>=2) type='turret';
    else if(roll>0.40 && wave>=3) type='sniper';      // 狙击机：波次>=3
    else if(roll>0.34 && wave>=3) type='shielded';
    else if(roll>0.28 && wave>=2) type='splitter';    // 分裂机
    const sm=1+(wave-1)*.2;
    const e={type};
    if(type==='grunt'){ e.w=36;e.h=36;e.hp=1;e.x=Math.random()*(W-36);e.y=-36;e.vy=(130+wave*8)*sm;e.score=10; }
    else if(type==='weaver'){ e.w=34;e.h=34;e.hp=1;e.x=Math.random()*(W-34);e.y=-34;e.vy=(100+wave*6)*sm;e.amp=70;e.freq=1.6+Math.random();e.phase=Math.random()*6.28;e.t=0;e.score=15; }
    else if(type==='drone'){
      // 自爆无人机：冲下来接近玩家时爆炸（无子弹，靠近才危险）
      e.w=30;e.h=30;e.hp=1;
      e.x=Math.random()*(W-30);e.y=-30;
      e.vy=(150+wave*10)*sm;
      e.score=20;
    }
    else if(type==='turret'){
      // 炮塔：慢速下行，到一定高度后停下开火一段时间再走
      e.w=48;e.h=44;e.hp=3;
      e.x=Math.random()*(W-48);e.y=-44;
      e.vy=(70+wave*5)*sm;
      e.fireCd=1.5;e.stopped=false;
      e.score=30;
    }
    else if(type==='shielded'){
      // 护盾机：外有一圈护盾（先破盾再破身），盾在时会旋转
      e.w=44;e.h=40;e.hp=2;e.shieldHp=3;
      e.x=Math.random()*(W-44);e.y=-44;
      e.vy=(85+wave*5)*sm;
      e.spin=0;
      e.score=35;
    }
    else if(type==='splitter'){
      // 分裂机：中型、慢速下降，死亡时分裂出 3 个快速小 grunt
      e.w=46;e.h=44;e.hp=2;
      e.x=Math.random()*(W-46);e.y=-44;
      e.vy=(70+wave*3)*sm;
      e.spin=0;
      e.score=30;
    }
    else if(type==='sniper'){
      // 狙击机：降到 y=150 悬停，瞄准约 1 秒后向玩家射 1 发高速子弹
      e.w=40;e.h=44;e.hp=3;
      e.x=Math.random()*(W-40);e.y=-44;
      e.vy=(120+wave*4)*sm;
      e.entered=false; e.aimT=1.0;
      e.score=45;
    }
    else if(type==='bomber'){
      // 轰炸机：慢速下降，周期性投掷缓慢下落的炸弹
      e.w=60;e.h=50;e.hp=4;
      e.x=Math.random()*(W-60);e.y=-50;
      e.vy=(50+wave*3)*sm;
      e.dropCd=1.2+Math.random()*.6;
      e.score=50;
    }
    else { e.w=64;e.h=56;e.hp=4;e.x=W/2-32+(Math.random()-.5)*140;e.y=-56;e.vy=(46+wave*4)*sm;e.score=40; }
    enemies.push(e);
  }

  // ---- 编队刷怪 ----
  function spawnFormation(type){
    const sm=1+(wave-1)*.2;
    if(type==='vee'){
      // V 字编队：5 只 grunt 成 V 形同时入场（中间领头在前，两翼拖后）
      const cx=W/2;
      for(let k=-2;k<=2;k++){
        const x=cx+k*42-18;
        const y=-36-Math.abs(k)*34;
        enemies.push({type:'grunt',w:36,h:36,hp:1,x:Math.max(0,Math.min(W-36,x)),y:y,vy:(130+wave*8)*sm,score:10});
      }
    } else if(type==='column'){
      // 纵队扫射：3-5 只 weaver 成一列连续入场
      const n=3+Math.floor(Math.random()*3);
      const baseX=Math.random()*(W-34);
      for(let k=0;k<n;k++){
        enemies.push({type:'weaver',w:34,h:34,hp:1,x:baseX,y:-34-k*72,vy:(100+wave*6)*sm,amp:70,freq:1.6+Math.random(),phase:Math.random()*6.28,t:0,score:15});
      }
    } else if(type==='mixed'){
      // 高波次混合波：V 字 + 纵队同时
      spawnFormation('vee');
      spawnFormation('column');
    }
  }

  // ---- Boss ----
  function spawnBoss(){
    lastBossWave=wave;        // 记录本波已刷 Boss，防止同波重刷
    boss = {
      type:'boss',
      w:160, h:110,
      x:W/2-80, y:-130,
      hp:40+wave*8,
      maxHp:40+wave*8,
      vy:0,
      phase:0,          // 0=入场,1=攻击,2=狂暴
      t:0,
      fireCd:0,
      speedMul:1,
      score:500,
      entered:false,
      enraged:false,
    };
    ebullets=[];        // 清屏敌弹，给玩家喘息
  }
  function updateBoss(dt){
    if(!boss) return;
    const b=boss;
    b.t+=dt;
    if(!b.entered){
      // 入场：从顶部下到 y=120
      b.y += 60*dt;
      if(b.y>=120){ b.y=120; b.entered=true; }
      return;
    }
    // 横向往返
    const speedMul = b.enraged ? 1.6 : 1;
    b.x += Math.cos(b.t*0.8)*120*speedMul*dt;
    b.x = Math.max(10, Math.min(W-b.w-10, b.x));
    // 切换狂暴（HP 低于 30%）
    if(!b.enraged && b.hp<b.maxHp*0.3){ b.enraged=true; boom(b.x+b.w/2,b.y+b.h/2,'#ff5c5c',40,400); tone(200,.4,'sawtooth',.08); }

    b.fireCd-=dt;
    if(b.fireCd<=0){
      const cx=b.x+b.w/2, cy=b.y+b.h;
      if(!b.enraged){
        // 三向扇形弹幕（波次越高弹速越快、间隔越短）
        const spd=Math.min(430,300+wave*6), cdw=Math.max(.35,.9-wave*.02);
        for(let a=-2;a<=2;a++){
          const ang=Math.PI/2 + a*0.35;
          ebullets.push({x:cx,y:cy,w:10,h:14,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd});
        }
        b.fireCd=cdw/b.speedMul;
      } else {
        // 狂暴：环形 + 高速直弹（随波次提速）
        const rspd=Math.min(460,340+wave*4);
        for(let i=0;i<10;i++){
          const ang=i/10*6.283 + b.t;
          ebullets.push({x:cx,y:cy,w:10,h:14,vx:Math.cos(ang)*rspd,vy:Math.sin(ang)*rspd});
        }
        ebullets.push({x:cx-40,y:cy,w:10,h:14,vx:0,vy:Math.min(700,520+wave*8)});
        ebullets.push({x:cx+30,y:cy,w:10,h:14,vx:0,vy:Math.min(700,520+wave*8)});
        b.fireCd=Math.max(.35,.55-wave*.01);
      }
    }
    b.phase = Math.floor(b.t/6)%2;   // 每 6 秒切换攻击模式（非狂暴）
  }
  function bossHit(){
    if(!boss) return;
    boss.hp-=Math.max(1,Math.round(bulletDmgMul));
    if(boss.hp<=0){
      score+=boss.score;
      killCount++;
      if(lifestealPct>0) score+=Math.max(1,Math.round(boss.score*lifestealPct/100)); // 吸血
      onKill();               // Boss 击杀也计入成长系统
      boom(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd479',80,500);
      boom(boss.x+boss.w/2,boss.y+boss.h/2,'#ff7a4d',60,420);
      tone(100,.6,'sawtooth',.09);
      // Boss 掉一个大道具
      items.push({type:'powerup',w:32,h:32,x:boss.x+boss.w/2-16,y:boss.y+boss.h/2,vy:90,spin:0});
      items.push({type:'heal',w:32,h:32,x:boss.x+boss.w/2-40,y:boss.y+boss.h/2,vy:90,spin:0});
      boss=null;
      bossPendingWave=0;      // Boss 死亡立即恢复普通刷怪
      setHud();
    }
  }
  function drawBoss(){
    if(!boss) return;
    const b=boss, cx=b.x+b.w/2, cy=b.y+b.h/2;
    ctx.save();
    // 主体
    ctx.shadowColor='#ff5c5c'; ctx.shadowBlur=b.enraged?30:18;
    ctx.fillStyle=b.enraged?'#8a1a1a':'#5a2050';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur=0;
    // 上层装甲
    ctx.fillStyle=b.enraged?'#ff5c5c':'#b06dff';
    ctx.fillRect(b.x+10, b.y+10, b.w-20, b.h*0.4);
    // 核心（会随血量变色）
    const coreCol = b.hp>b.maxHp*0.5?'#7ae0ff':(b.hp>b.maxHp*0.3?'#ffd479':'#ff5c5c');
    ctx.fillStyle=coreCol;
    ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 6.28); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 6.28); ctx.fill();
    // 两侧炮口
    ctx.fillStyle='#3a3a5a';
    ctx.fillRect(b.x-6, b.y+b.h*0.3, 12, 24);
    ctx.fillRect(b.x+b.w-6, b.y+b.h*0.3, 12, 24);
    ctx.restore();
    // 血条
    const bw=140, bx=cx-bw/2, by=b.y-14;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(bx,by,bw,8);
    ctx.fillStyle=b.hp>b.maxHp*0.3?'#ff5c7a':'#ffd479';
    ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),8);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.strokeRect(bx,by,bw,8);
    // 狂暴提示
    if(b.enraged){
      ctx.fillStyle='#ffd479'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('狂暴模式', cx, by-4);
    }
  }
  function boom(x,y,color,n,spd){
    n=n||14; spd=spd||260;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=60+Math.random()*spd;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.4+Math.random()*.5,max:.9,color,s:2+Math.random()*3});
    }
  }
  function fire(){
    if(player.cd>0) return;
    player.cd=P.fireCd*fireCdMul;
    const cx=player.x+P.w/2, top=player.y-8;
    const dmg=Math.max(1,Math.round(bulletDmgMul));   // 子弹伤害 = bulletDmgMul
    const mk=(x,y,w,h,v,vx,kind,pierce)=>bullets.push({x,y,w,h,v,vx:vx||0,dmg,kind:kind||'main',pierce:pierce||0,split:false});
    // 等级 1：双管
    mk(cx-14,top,6,18,P.bulletSpeed);
    mk(cx+8, top,6,18,P.bulletSpeed);
    // 等级 2：加两发斜向
    if(fireLevel>=2){
      mk(cx-22,top+14,5,16,P.bulletSpeed,-90);
      mk(cx+16,top+14,5,16,P.bulletSpeed,90);
    }
    // 等级 3：加一发正中间厚弹
    if(fireLevel>=3){
      mk(cx-3,top-14,6,24,P.bulletSpeed*1.05);
    }
    // 等级 4：加两发远距离慢弹
    if(fireLevel>=4){
      mk(cx-28,top+28,5,14,P.bulletSpeed*.8,-160);
      mk(cx+24,top+28,5,14,P.bulletSpeed*.8,160);
    }
    // 等级 5：六向全开
    if(fireLevel>=5){
      mk(cx-34,top+38,4,12,P.bulletSpeed*.7,-230);
      mk(cx+30,top+38,4,12,P.bulletSpeed*.7,230);
    }
    // 激光主炮：每 3 发追加 1 发高伤激光弹
    if(laserLevel>0){
      laserCd+=1;
      if(laserCd>=3){
        laserCd=0;
        bullets.push({x:cx-2,y:top-10,w:8,h:30,v:P.bulletSpeed*1.6,dmg:6,kind:'laser',pierce:0,split:false});
      }
    }
    tone(760,.05,'square',.02);
  }
  function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  // ---- 道具（test-items 分支）----
  const ITEM_TYPES = ['powerup','heal','shield'];
  function spawnItem(){
    const type = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
    const it = { type, w:32, h:32, x:Math.random()*(W-32), y:-32, vy:90, spin:0 };
    items.push(it);
  }
  function applyItem(it){
    boom(it.x+16,it.y+16,'#ffe08a',16,200);
    if(it.type==='powerup'){
      fireLevel=Math.min(5,fireLevel+1);
      tone(880,.12,'sine',.06);
    } else if(it.type==='heal'){
      player.livesLeft=Math.min(P.lives+extraLife,player.livesLeft+1);
      updateLives();
      tone(520,.12,'sine',.06);
    } else if(it.type==='shield'){
      shieldT=6;
      tone(660,.15,'sine',.06);
    }
  }

  // ---- 成长系统：每 10 击杀升级，自动强化 ----
  function onKill(){
    // 每 10 击杀触发一次成长升级
    if(killCount>0 && killCount%10===0){
      playerLevel++;
      bulletDmgMul=1+playerLevel*0.05;          // 每级伤害 +5%
      moveSpeedMul=1+playerLevel*0.03;          // 每级移动速度 +3%
      invMul=Math.max(.5,1-playerLevel*0.05);   // 每级无敌时间 -5%
      setHud();
      // 升级音效 + 粒子提示
      tone(520,.1,'square',.05); tone(660,.12,'square',.05); tone(880,.16,'sine',.06);
      const cx=player.x+P.w/2, cy=player.y+P.h/2;
      for(let i=0;i<26;i++){
        const a=i/26*Math.PI*2;
        particles.push({x:cx,y:cy,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:.6,max:.9,color:'#ffd479',s:3});
      }
    }
    // 每 25 击杀弹 3 选 1 随机增强面板
    if(killCount>0 && killCount%25===0 && !panelOpen && state!=='over'){
      openEnhancePanel();
    }
  }

  // ---- 3 选 1 随机增强池（10 种，满足 ≥8）----
  const ENHANCE_POOL=[
    { id:'fire',      name:'火力升级', desc:'火力等级 +1',
      apply(){ fireLevel=Math.min(5,fireLevel+1); } },
    { id:'rapid',     name:'极速射击', desc:'射击间隔 -30%',
      apply(){ fireCdMul=Math.max(.35,fireCdMul*.7); } },
    { id:'pierce',    name:'穿透子弹', desc:'子弹额外穿透 1 架敌机',
      apply(){ pierceLevel+=1; } },
    { id:'split',     name:'分裂子弹', desc:'主弹额外分裂 2 枚斜弹',
      apply(){ splitLevel+=1; } },
    { id:'armor',     name:'护体装甲', desc:'额外 +1 生命',
      apply(){ extraLife+=1; updateLives(); } },
    { id:'dodge',     name:'急速闪避', desc:'移动速度 +40%',
      apply(){ moveSpeedMul*=1.4; } },
    { id:'laser',     name:'激光主炮', desc:'每 3 发追加 1 发高伤激光弹',
      apply(){ laserLevel+=1; } },
    { id:'lifesteal', name:'吸血',     desc:'击杀额外获得 5% 分数奖励',
      apply(){ lifestealPct+=5; } },
    { id:'shield',    name:'强化护盾', desc:'立即获得 8 秒护盾',
      apply(){ shieldT=Math.max(shieldT,8); } },
    { id:'bomb',      name:'弹幕强化', desc:'额外分裂 1 枚侧弹',
      apply(){ splitLevel+=1; } },
  ];
  function openEnhancePanel(){
    panelOpen=true;
    state='paused';               // 游戏暂停，等待选择
    const pool=[...ENHANCE_POOL];
    const picks=[];
    while(picks.length<3){
      picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    }
    const panel=document.getElementById('enhancePanel');
    const list=document.getElementById('enhanceList');
    list.innerHTML='';
    picks.forEach(p=>{
      const card=document.createElement('div');
      card.className='enhance-card';
      const nm=document.createElement('div'); nm.className='enhance-name'; nm.textContent=p.name;
      const ds=document.createElement('div'); ds.className='enhance-desc'; ds.textContent=p.desc;
      card.appendChild(nm); card.appendChild(ds);
      card.addEventListener('click',()=>{
        p.apply();
        panelOpen=false;
        state='running';          // 选择后恢复游戏
        panel.classList.remove('show');
        setHud();
        boom(player.x+P.w/2,player.y+P.h/2,'#8affd0',20,240);
        tone(1180,.14,'sine',.07);
      });
      list.appendChild(card);
    });
    panel.classList.add('show');
    tone(1040,.1,'sine',.06);
  }

  // ---- 主循环 ----
  let lastT=0;
  function frame(t){
    requestAnimationFrame(frame);
    if(state==='idle'||state==='paused'){ lastT=t; draw(); return; }
    const dt=Math.min(.05,(t-lastT)/1000||.016);
    lastT=t;
    if(state==='running') update(dt);
    draw();
  }

  function update(dt){
    elapsed+=dt;
    for(const s of stars){ s.y+=s.v*dt; if(s.y>H){ s.y=-4; s.x=Math.random()*W; } }
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }

    // 玩家移动
    let tx=0,ty=0;
    if(keys['a']||keys['arrowleft']) tx-=1;
    if(keys['d']||keys['arrowright']) tx+=1;
    if(keys['w']||keys['arrowup']) ty-=1;
    if(keys['s']||keys['arrowdown']) ty+=1;
    const L=Math.hypot(tx,ty); if(L>0){ tx/=L; ty/=L; }
    const spd=P.speed*moveSpeedMul;
    player.x+=tx*spd*dt; player.y+=ty*spd*dt;
    player.x=Math.max(4,Math.min(W-P.w-4,player.x));
    player.y=Math.max(80,Math.min(H-P.h-30,player.y));
    player.angle=tx*.26;
    if(player.cd>0) player.cd-=dt;
    if(player.inv>0) player.inv-=dt;
    if(keys[' ']||mouseDown) fire();

    // 玩家子弹（支持穿透/分裂/激光增强）
    laserCd-=dt;
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.y-=b.v*dt;
      if(b.vx){ b.x+=b.vx*dt; }
      if(b.y+b.h<0){ bullets.splice(i,1); continue; }
      // 分裂子弹：主弹（无 vx 且非 laser）在首次分裂时生成 2 枚斜弹
      if(b.kind==='main'&&splitLevel>0&&!b.split&&b.y<H*.45){
        b.split=true;
        for(let s=-1;s<=1;s+=2){
          bullets.push({x:b.x+b.w/2+s*10,y:b.y+b.h/2,w:4,h:12,v:P.bulletSpeed*.9,vx:s*150,kind:'split',pierce:0});
        }
      }
    }
    // 敌弹
    for(let i=ebullets.length-1;i>=0;i--){ const b=ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>H+12||b.y<-20||b.x<-12||b.x>W+12) ebullets.splice(i,1); }
    // 炸弹（轰炸机投掷）：缓慢下落，到玩家高度/落地爆炸成 8 向环形弹幕
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i];
      b.y+=b.vy*dt;
      if(b.y+b.h>=player.y || b.y>H){
        const cx=b.x+b.w/2, cy=Math.min(b.y+b.h/2,H);
        for(let k=0;k<8;k++){
          const a=k/8*Math.PI*2;
          ebullets.push({x:cx-4,y:cy-6,w:9,h:13,vx:Math.cos(a)*230,vy:Math.sin(a)*230});
        }
        boom(cx,cy,'#ff9d4d',12,170);
        bombs.splice(i,1);
      }
    }

    // 道具掉落（计时器驱动）
    itemCd-=dt;
    if(itemCd<=0){
      spawnItem();
      itemCd=7+Math.random()*4;
    }
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.y+=it.vy*dt;
      it.spin+=dt*3;
      if(it.y>H+30){ items.splice(i,1); continue; }
      if(hit(player, it)) { applyItem(it); items.splice(i,1); }
    }

    // 护盾倒计时
    if(shieldT>0){ shieldT-=dt; }

    // 敌机（Boss 战中仍正常刷怪，供玩家积累击杀/成长）
    spawnCd-=dt;
    if(spawnCd<=0){ spawnEnemy(); spawnCd=Math.max(.4,1.2/(1+(wave-1)*.3)); }
    // 编队刷新：wave>=4 起计时器周期性触发，频率随波次提高，与普通单只刷怪交错
    if(wave>=4){
      formationCd-=dt;
      if(formationCd<=0){
        if(wave>=8 && Math.random()<0.4) spawnFormation('mixed');
        else spawnFormation(Math.random()<0.5?'vee':'column');
        formationCd=Math.max(3,10-wave*.5);
      }
    }
    updateBoss(dt);
    outer: for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.y+=e.vy*dt;
      if(e.vx){ e.x+=e.vx*dt; e.x=Math.max(-e.w,Math.min(W,e.x)); }
      if(e.type==='weaver'){ e.t+=dt; e.x=Math.max(0,Math.min(W-e.w,e.x+Math.cos(e.t*e.freq+e.phase)*e.amp*dt*3.2)); }
      if(e.type==='drone'){
        // 自爆：靠近玩家时加速俯冲
        const dx=(player.x+P.w/2)-(e.x+e.w/2), dy=(player.y+P.h/2)-(e.y+e.h/2);
        const d=Math.hypot(dx,dy);
        if(d<220){ e.vy+=200*dt; }
      }
      if(e.type==='turret'){
        if(!e.stopped && e.y>200){ e.stopped=true; e.vy=0; }
        e.fireCd-=dt;
        if(e.stopped&&e.fireCd<=0){
          const cx=e.x+e.w/2;
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:0,vy:360});
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:-160,vy:300});
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:160,vy:300});
          e.fireCd=1.4;
        }
        if(e.stopped&&e.y>H*.55){ e.vy=(60+wave*4); }  // 下够了就离开
      }
      if(e.type==='shielded'){ e.spin+=dt*1.5; }
      if(e.type==='splitter'){ e.spin+=dt*2; }
      if(e.type==='sniper'){
        if(!e.entered){
          if(e.y>=150){ e.y=150; e.entered=true; e.vy=0; e.aimT=1.0; }
        } else {
          e.aimT-=dt;
          if(e.aimT<=0){
            const sx=e.x+e.w/2, sy=e.y+e.h;
            const dx=(player.x+P.w/2)-sx, dy=(player.y+P.h/2)-sy;
            const d=Math.hypot(dx,dy)||1;
            ebullets.push({x:sx-4,y:sy,w:8,h:16,vx:dx/d*620,vy:dy/d*620});
            tone(900,.08,'square',.03);
            e.aimT=1.0;
          }
        }
      }
      if(e.type==='bomber'){
        e.dropCd-=dt;
        if(e.dropCd<=0){
          bombs.push({x:e.x+e.w/2-5,y:e.y+e.h,w:10,h:16,vy:90});
          e.dropCd=1.4+Math.random()*.5;
        }
      }
      if(e.type==='tank'&&e.y>240&&e.y<H*.6&&Math.random()<.02){
        const cx=e.x+e.w/2;
        ebullets.push({x:cx-4,y:e.y+e.h,w:8,h:12,vx:0,vy:330});
        ebullets.push({x:cx-20,y:e.y+e.h,w:8,h:12,vx:-130,vy:280});
        ebullets.push({x:cx+12,y:e.y+e.h,w:8,h:12,vx:130,vy:280});
      }
      if(e.y>H+90){ enemies.splice(i,1); continue; }
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(hit(b,e)){
          // 护盾机：先破盾（消耗 1 发，不穿透）
          if(e.type==='shielded'&&e.shieldHp>0){
            e.shieldHp-=1;
            boom(b.x+b.w/2,b.y+b.h/2,'#6fd8ff',4,120);
            bullets.splice(j,1);
            continue;
          }
          e.hp-=(b.dmg||1);
          boom(e.x+e.w/2,e.y+e.h/2,'#ffd479',5,160);
          // 穿透子弹：消耗穿透次数，否则消耗子弹
          if((b.pierce||0)>0){ b.pierce--; }
          else { bullets.splice(j,1); }
          if(e.hp<=0){
            score+=e.score;
            killCount++;
            if(lifestealPct>0) score+=Math.max(1,Math.round(e.score*lifestealPct/100)); // 吸血：击杀回 5% 分数奖励
            const col = e.type==='tank'?'#c98bff':(e.type==='drone'?'#ff8a4d':(e.type==='shielded'?'#6fd8ff':(e.type==='splitter'?'#7dff8a':(e.type==='sniper'?'#ff4d6d':(e.type==='bomber'?'#ffb34d':'#9fe0ff')))));
            boom(e.x+e.w/2,e.y+e.h/2,col,e.type==='tank'?28:15,300);
            if(e.type==='drone'){ boom(e.x+e.w/2,e.y+e.h/2,'#ff5c5c',30,360); }  // 自爆特效
            if(e.type==='splitter'){
              // 死亡分裂：向两侧扇形喷出 3 个快速小 grunt
              for(let k=-1;k<=1;k++){
                enemies.push({type:'grunt',w:26,h:26,hp:1,x:e.x+e.w/2-13+k*30,y:e.y,vx:k*150,vy:240+wave*6,score:5});
              }
            }
            tone(400,.09,'sawtooth',.04);
            onKill();               // 击杀计数：成长升级 + 3 选 1 增强面板
            enemies.splice(i,1); setHud();
            continue outer;
          }
          // 未击杀但穿透子弹保留，继续命中其他敌机
          break;
        }
      }
      if(enemies[i]===e&&player.inv<=0&&hit(player,e)){
        if(e.type==='drone'){
          // 自爆无人机撞到玩家 = 立即爆炸扣血
          boom(e.x+e.w/2,e.y+e.h/2,'#ff5c5c',34,380);
          enemies.splice(i,1);
        }
        playerHit();
      }
    }
    // Boss 碰撞
    if(boss&&player.inv<=0&&hit(player,boss)){
      playerHit();
    }
    // 玩家子弹 vs Boss（支持穿透）
    if(boss){
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(hit(b,boss)){
          boom(b.x+b.w/2,b.y+b.h/2,'#ffd479',4,140);
          bossHit();
          if((b.pierce||0)>0){ b.pierce--; }
          else { bullets.splice(j,1); }
          break;
        }
      }
    }
    if(player.inv<=0){
      for(let i=ebullets.length-1;i>=0;i--){
        const b=ebullets[i];
        if(hit(b,player)){ ebullets.splice(i,1); playerHit(); break; }
      }
    }
    waveTimer-=dt;
    if(waveTimer<=0){
      wave++; waveTimer=20; spawnCd=.2; setHud();
      // 每波 Boss：wave 每次递增时刷新该波 Boss（lastBossWave 防同波重刷）
      if(!boss && lastBossWave!==wave){
        bossPendingWave=wave;
        spawnBoss();
      }
    }
  }

  function playerHit(){
    // 护盾抵挡：不扣血，只清掉周围敌弹并短闪
    if(shieldT>0){
      // 清除附近敌弹，给个护盾破碎效果
      for(let i=ebullets.length-1;i>=0;i--){
        const b=ebullets[i];
        if(Math.hypot(b.x-player.x,b.y-player.y)<110) ebullets.splice(i,1);
      }
      boom(player.x+P.w/2,player.y+P.h/2,'#7ae0ff',22,260);
      tone(1200,.1,'sine',.05);
      shieldT=Math.max(0,shieldT-1.2);   // 每次抵挡消耗护盾
      player.inv=Math.max(player.inv,.5);
      return;
    }
    player.livesLeft--;
    player.inv=P.invincible*invMul;      // 无敌时间随等级缩短
    hitFlash=.22;
    boom(player.x+P.w/2,player.y+P.h/2,'#ff5c7a',34,360);
    tone(120,.25,'sawtooth',.06);
    updateLives();
    if(player.livesLeft<=0) gameOver();
  }
  function gameOver(){
    state='over';
    if(score>hiscore){ hiscore=score; localStorage.setItem('tf.hiscore',hiscore); }
    document.getElementById('hiscore').textContent=hiscore;
    showOverlay('over');
  }

  // ---- 覆盖层 ----
  function showOverlay(kind){
    const ov=document.getElementById('overlay'), title=document.getElementById('ovTitle');
    const scoreEl=document.getElementById('ovScore'), scoreVal=document.getElementById('ovScoreVal');
    ov.classList.add('show');
    if(kind==='over'){ title.textContent='游戏结束'; scoreEl.style.display='block'; scoreVal.textContent=score; document.getElementById('startBtn').textContent='再 来 一 局'; }
    else { title.textContent='雷霆战机'; scoreEl.style.display='none'; document.getElementById('startBtn').textContent='开 始 游 戏'; }
  }
  function startGame(){
    initAudio();
    resetGame();
    updateLives();
    setHud();
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('enhancePanel').classList.remove('show');
    state='running';
  }

  // ---- 绘制 ----
  function draw(){
    ctx.fillStyle='#04060f'; ctx.fillRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=s.b; ctx.fillStyle='#bfe0ff'; ctx.fillRect(s.x,s.y,s.s,s.s*1.7); }
    ctx.globalAlpha=1;
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.s,p.s); }
    ctx.globalAlpha=1;
    for(const b of bullets){
      if(b.kind==='laser'){
        ctx.fillStyle='#8affd0'; ctx.shadowColor='#3aff8a'; ctx.shadowBlur=14;
        ctx.fillRect(b.x,b.y,b.w,b.h);
      } else {
        ctx.fillStyle='#b6f6ff'; ctx.shadowColor='#3aa0ff'; ctx.shadowBlur=10;
        ctx.fillRect(b.x,b.y,b.w,b.h);
      }
    }
    ctx.shadowBlur=0;
    for(const b of ebullets){ ctx.fillStyle='#ff7a9a'; ctx.shadowColor='#ff5c7a'; ctx.shadowBlur=7; ctx.beginPath(); ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,6.28); ctx.fill(); }
    ctx.shadowBlur=0;
    for(const b of bombs){
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      ctx.fillStyle='#3a3a4a'; ctx.beginPath(); ctx.arc(cx,cy,7,0,6.28); ctx.fill();
      ctx.fillStyle='#ff8a4d'; ctx.fillRect(cx-2,b.y-6,4,6);
      ctx.fillStyle='#ffd479'; ctx.beginPath(); ctx.arc(cx,b.y-7,2,0,6.28); ctx.fill();
    }
    for(const e of enemies) drawEnemy(e);
    drawBoss();

    // 道具
    for(const it of items) drawItem(it);

    // 玩家：画在最上层，带发光（已验证可见）
    if(state!=='over'&&player) drawPlayer();

    // 护盾环
    if(state!=='over'&&shieldT>0&&player){
      const cx=player.x+P.w/2, cy=player.y+P.h/2;
      const pulse = 1+Math.sin(elapsed*6)*.06;
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = shieldT>2 ? 'rgba(122,224,255,.9)' : 'rgba(255,160,90,.9)';
      ctx.lineWidth = 3;
      ctx.shadowColor = shieldT>2 ? '#7ae0ff' : '#ffa05a';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(cx, cy, 52*pulse, 0, 6.28);
      ctx.stroke();
      ctx.restore();
    }

    if(hitFlash>0){ ctx.fillStyle='rgba(255,60,90,'+(hitFlash*.35)+')'; ctx.fillRect(0,0,W,H); hitFlash=Math.max(0,hitFlash-.02); }
  }

  function drawItem(it){
    const cx=it.x+16, cy=it.y+16;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(it.spin*0.4);
    const cols = { powerup:['#ffd24d','#a86a00','P'], heal:['#ff6f8f','#8a1f35','+'], shield:['#6fd8ff','#0f5a8a','S'] };
    const c = cols[it.type];
    ctx.shadowColor=c[0]; ctx.shadowBlur=14;
    ctx.fillStyle=c[0];
    ctx.beginPath();
    // 旋转的六边形
    for(let i=0;i<6;i++){
      const a=i/6*6.283 - Math.PI/2;
      const r=16;
      if(i===0) ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#0b1220';
    ctx.font='bold 16px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c[2],0,1);
    ctx.restore();
  }

  function drawPlayer(){
    const p=player, cx=p.x+P.w/2, cy=p.y+P.h/2;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.inv>0 && Math.floor(elapsed*10)%2===0 ? .45 : 1;
    // 尾焰
    ctx.fillStyle='rgba(120,200,255,.45)';
    ctx.beginPath(); ctx.ellipse(0,P.h/2+12,7,14,0,0,6.28); ctx.fill();
    // 光晕 + 机翼
    ctx.shadowColor='#63c8ff'; ctx.shadowBlur=22;
    ctx.fillStyle='#2f8fe8';
    ctx.beginPath();
    ctx.moveTo(-P.w/2,P.h/2-4);
    ctx.lineTo(-P.w/2*.55,-P.h/2*.25);
    ctx.lineTo(-P.w/2*.18,-P.h/2);
    ctx.lineTo(0,-P.h*.35);
    ctx.lineTo(P.w/2*.18,-P.h/2);
    ctx.lineTo(P.w/2*.55,-P.h/2*.25);
    ctx.lineTo(P.w/2,P.h/2-4);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // 高光
    ctx.fillStyle='#7fd0ff';
    ctx.beginPath(); ctx.moveTo(0,-P.h/2+4); ctx.lineTo(8,6); ctx.lineTo(-8,6); ctx.closePath(); ctx.fill();
    // 座舱
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,-4,5,0,6.28); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x+e.w/2,e.y+e.h/2);
    if(e.type==='grunt'){
      ctx.fillStyle='#ff5c7a';
      ctx.beginPath();
      ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,-e.h/2*.4); ctx.lineTo(e.w/2*.4,-e.h/2);
      ctx.lineTo(-e.w/2*.4,-e.h/2); ctx.lineTo(-e.w/2,-e.h/2*.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd0da'; ctx.beginPath(); ctx.arc(0,-2,4,0,6.28); ctx.fill();
    } else if(e.type==='weaver'){
      ctx.fillStyle='#ff9d4d';
      ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,0); ctx.lineTo(0,-e.h/2); ctx.lineTo(-e.w/2,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffe4c4'; ctx.beginPath(); ctx.arc(0,0,3.5,0,6.28); ctx.fill();
    } else if(e.type==='drone'){
      // 自爆无人机：红橙闪烁 + 引信
      const blink = Math.floor(elapsed*10)%2===0;
      ctx.fillStyle=blink?'#ff3a3a':'#ff8a4d';
      ctx.beginPath(); ctx.arc(0,0,15,0,6.28); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill();
      // 四角刺
      ctx.strokeStyle='#ff5c5c'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const a=i/4*6.283+elapsed*4;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*15,Math.sin(a)*15); ctx.lineTo(Math.cos(a)*22,Math.sin(a)*22); ctx.stroke();
      }
    } else if(e.type==='turret'){
      // 炮塔：方形 + 旋转炮管
      ctx.fillStyle='#5a6a8a';
      ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
      ctx.fillStyle='#8a9aba';
      ctx.fillRect(-e.w/2+6,-e.h/2+6,e.w-12,e.h-12);
      ctx.save();
      ctx.rotate(elapsed*2);
      ctx.fillStyle='#3a4a6a';
      ctx.fillRect(-4,-e.h/2-4,8,20);
      ctx.restore();
      ctx.fillStyle='#ff5c7a'; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill();
    } else if(e.type==='shielded'){
      // 护盾机：紫色机身 + 旋转护盾圈
      ctx.fillStyle='#8a5aff';
      ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.fill();
      ctx.fillStyle='#c9b8ff'; ctx.beginPath(); ctx.arc(0,0,8,0,6.28); ctx.fill();
      if(e.shieldHp>0){
        ctx.save();
        ctx.rotate(e.spin);
        ctx.strokeStyle='rgba(111,216,255,.9)';
        ctx.lineWidth=3;
        ctx.shadowColor='#6fd8ff'; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,24,0.4,2.4); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,24,0.4+3.14,2.4+3.14); ctx.stroke();
        ctx.restore();
      }
    } else if(e.type==='splitter'){
      // 分裂机：青绿色多面体 + 旋转
      ctx.save();
      ctx.rotate(e.spin||0);
      ctx.shadowColor='#3ae08a'; ctx.shadowBlur=10;
      ctx.fillStyle='#3ae08a';
      ctx.beginPath();
      for(let k=0;k<6;k++){
        const a=k/6*6.283;
        const r=e.w/2*.85;
        if(k===0) ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0;
      ctx.restore();
      ctx.fillStyle='#d0ffe6'; ctx.beginPath(); ctx.arc(0,0,7,0,6.28); ctx.fill();
      ctx.strokeStyle='rgba(120,255,180,.7)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,e.w/2,0,6.28); ctx.stroke();
    } else if(e.type==='sniper'){
      // 狙击机：红色细长机身 + 激光瞄准线
      ctx.fillStyle='#ff4d6d';
      ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,0); ctx.lineTo(0,-e.h/2); ctx.lineTo(-e.w/2,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffb3c1'; ctx.beginPath(); ctx.arc(0,-4,5,0,6.28); ctx.fill();
      if(e.entered&&e.aimT>0){
        const tx=(player.x+P.w/2)-(e.x+e.w/2), ty=(player.y+P.h/2)-(e.y+e.h/2);
        ctx.save();
        ctx.globalAlpha=Math.max(.25,Math.min(1,e.aimT*1.6));
        ctx.strokeStyle='#ff5c7a'; ctx.lineWidth=1.5;
        ctx.shadowColor='#ff5c7a'; ctx.shadowBlur=6;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    } else if(e.type==='bomber'){
      // 轰炸机：橙棕色宽体 + 炸弹舱
      ctx.fillStyle='#d9802f';
      ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2,0,0,6.28); ctx.fill();
      ctx.fillStyle='#ffb34d';
      ctx.beginPath(); ctx.ellipse(0,-4,e.w/2-8,e.h/2-10,0,0,6.28); ctx.fill();
      ctx.fillStyle='#3a2a1a';
      ctx.fillRect(-e.w/2+10,e.h/2-8,e.w-20,8);
      ctx.fillStyle='#ffd479'; ctx.beginPath(); ctx.arc(0,e.h/2-4,3,0,6.28); ctx.fill();
    } else { // tank
      ctx.fillStyle='#b06dff'; ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h*.7);
      ctx.fillStyle='#7a3cff'; ctx.fillRect(-e.w/2,e.h*.2,e.w,e.h*.3);
      for(let i=0;i<e.hp;i++){ ctx.fillStyle='#d9b8ff'; ctx.fillRect(-e.w/2+6+i*12,e.h/2-8,8,4); }
    }
    ctx.restore();
  }

  // ---- 输入 ----
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
    if(k==='p'&&state==='running'){ state='paused'; showOverlay('pause'); return; }
    if(k==='p'&&state==='paused'){ state='running'; document.getElementById('overlay').classList.remove('show'); return; }
    if(k==='m'){ muted=!muted; return; }
    keys[k]=true;
  });
  document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  function pointerMove(e){
    if(state!=='running'&&state!=='idle') return;
    const r=cvs.getBoundingClientRect(), s=W/r.width;
    const pt=e.touches?e.touches[0]:e;
    player.x=(pt.clientX-r.left)*s-P.w/2;
    player.y=(pt.clientY-r.top)*s-P.h/2;
    player.x=Math.max(4,Math.min(W-P.w-4,player.x));
    player.y=Math.max(80,Math.min(H-P.h-30,player.y));
  }
  cvs.addEventListener('mousemove',pointerMove);
  cvs.addEventListener('touchmove',e=>{ e.preventDefault(); pointerMove(e); },{passive:false});
  // 鼠标长按：按住持续射击（主版本需求）
  cvs.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    mouseDown = true;
    if(state==='running') fire();   // 立刻射一发，避免首次延迟
  });
  document.addEventListener('mouseup',e=>{ if(e.button===0) mouseDown = false; });
  cvs.addEventListener('mouseleave',()=>{ mouseDown = false; });
  // 触屏长按
  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();
    mouseDown = true;
    if(state==='running') fire();
    pointerMove(e);
  },{passive:false});
  document.addEventListener('touchend',e=>{ if(e.type==='touchend'||!e.touches.length) mouseDown=false; });

  document.getElementById('startBtn').addEventListener('click',startGame);
  window.addEventListener('resize',()=>{});

  // ---- 启动 ----
  resetGame();
  updateLives();
  setHud();
  showOverlay('start');
  requestAnimationFrame(frame);
})();
</script>
</body>
