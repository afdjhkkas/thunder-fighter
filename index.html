<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060f;color:#cfe3ff;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 700px at 50% 30%, #0a1230, #02030a 70%);
  }
  canvas{
    display:block;height:100vh;width:auto;max-width:100vw;
    touch-action:none;image-rendering:pixelated;background:#04060f;
  }
  #hud{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums;
    user-select:none;pointer-events:none;z-index:5;
  }
  .hud-box{
    background:rgba(5,10,30,.6);border:1px solid rgba(90,140,255,.25);
    padding:5px 12px;border-radius:10px;min-width:80px;text-align:center;backdrop-filter:blur(6px);
  }
  .hud-lbl{font-size:10px;color:#7aa0ff;letter-spacing:1px}
  .hud-val{font-size:17px;font-weight:700;color:#eaf2ff}
  .livedot{color:#ff5c7a}
  .livedot.lost{color:#2a3350}
  #overlay{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(4,8,24,.8);border:1px solid rgba(90,140,255,.3);border-radius:20px;
    padding:32px 38px;backdrop-filter:blur(10px);text-align:center;max-width:420px;
  }
  #overlay.show{display:flex}
  #overlay h1{font-size:36px;color:#8fd0ff;letter-spacing:6px;margin-bottom:10px;text-shadow:0 0 24px rgba(80,160,255,.6)}
  #overlay .sub{color:#8aa3d6;font-size:14px;margin-bottom:18px;line-height:1.9}
  #overlay .keys{font-size:12px;color:#6f87c0;margin-bottom:20px;line-height:2}
  .k{display:inline-block;min-width:24px;padding:2px 8px;margin:0 2px;border:1px solid #3b4a7a;border-radius:6px;background:#0c1230;color:#9fc0ff;font-size:12px}
  #overlay .score-final{font-size:22px;color:#ffd479;font-weight:700;margin-bottom:20px}
  #startBtn{
    font-size:16px;padding:12px 34px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#3aa0ff,#7a5cff);color:#fff;font-weight:700;letter-spacing:3px;
    box-shadow:0 8px 30px rgba(60,120,255,.4);transition:transform .15s;
  }
  #startBtn:hover{transform:scale(1.04)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="540" height="960"></canvas>

  <div id="hud">
    <div class="hud-box"><div class="hud-lbl">分数</div><div class="hud-val" id="score">0</div></div>
    <div class="hud-box"><div class="hud-lbl">最高</div><div class="hud-val" id="hiscore">0</div></div>
    <div class="hud-box"><div class="hud-lbl">生命</div><div class="hud-val" id="lives"></div></div>
    <div class="hud-box"><div class="hud-lbl">波次</div><div class="hud-val" id="wave">1</div></div>
    <div class="hud-box"><div class="hud-lbl">火力</div><div class="hud-val" id="fire">1</div></div>
  </div>

  <div id="overlay">
    <h1 id="ovTitle">雷霆战机</h1>
    <div class="score-final" id="ovScore" style="display:none">得分 <span id="ovScoreVal">0</span></div>
    <div class="sub">击落敌机 · 躲避弹幕 · 突破波次<br>难度会越来越高</div>
    <div class="keys">
      <span class="k">A</span><span class="k">D</span><span class="k">W</span><span class="k">S</span> 或方向键移动
      <span class="k">空格</span> 射击<br>
      <span class="k">P</span> 暂停 · <span class="k">M</span> 静音 · 也能用鼠标控制
    </div>
    <button id="startBtn">开 始 游 戏</button>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const W = 540, H = 960;

  // ---- 音效（合成，无文件）----
  let actx = null, muted = false;
  function initAudio(){ if(actx) return; try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function tone(freq,dur,type,vol){
    if(muted||!actx) return;
    try{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type||'square'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.05, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  // ---- 常量 ----
  const P = { w:56, h:60, speed:300, fireCd:.14, bulletSpeed:820, lives:3, invincible:1.8 };

  // ---- 状态 ----
  let state='idle', player, bullets=[], ebullets=[], enemies=[], particles=[], stars=[], items=[];
  let score=0, hiscore, wave=1, waveTimer=20, spawnCd=.6, elapsed=0, keys={}, hitFlash=0, mouseDown=false;
  let fireLevel=1;            // 武器等级 1..3
  let shieldT=0;             // 护盾剩余秒数
  let itemCd=8;              // 道具掉落冷却（秒）
  let boss=null;             // Boss 引用
  let bossPendingWave=0;     // 该波结束时召唤 Boss
  hiscore = +(localStorage.getItem('tf.hiscore')||0);
  document.getElementById('hiscore').textContent = hiscore;

  function resetGame(){
    // 飞机停在画面正中（y=H/2），最显眼
    player = { x:W/2-P.w/2, y:H/2-P.h/2, w:P.w, h:P.h, cd:0, inv:0, angle:0, livesLeft:P.lives };
    bullets=[]; ebullets=[]; enemies=[]; particles=[]; items=[];
    score=0; wave=1; waveTimer=20; spawnCd=.6; elapsed=0;
    fireLevel=1; shieldT=0; itemCd=6;
    boss=null; bossPendingWave=0;
    stars=[];
    for(let i=0;i<110;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:1+Math.random()*2.4, v:50+Math.random()*280, b:.25+Math.random()*.7});
    updateLives();
  }

  // ---- HUD ----
  function updateLives(){
    const el=document.getElementById('lives');
    const left=player?player.livesLeft:P.lives;
    el.innerHTML='';
    for(let i=0;i<P.lives;i++){
      const s=document.createElement('span');
      s.className='livedot'+(i<left?'':' lost');
      s.textContent='●';
      el.appendChild(s);
    }
  }
  function setHud(){
    document.getElementById('score').textContent=score;
    document.getElementById('wave').textContent=wave;
    document.getElementById('fire').textContent=fireLevel;
  }

  // ---- 敌机 ----
  function spawnEnemy(){
    const roll=Math.random();
    let type='grunt';
    const waveBonus = Math.min(.4, wave*.03);
    if(roll>0.82-waveBonus) type='tank';
    else if(roll>0.62) type = Math.random()<0.5 ? 'weaver' : 'drone';
    else if(roll>0.45 && wave>=2) type='turret';
    else if(roll>0.35 && wave>=3) type='shielded';
    const sm=1+(wave-1)*.2;
    const e={type};
    if(type==='grunt'){ e.w=36;e.h=36;e.hp=1;e.x=Math.random()*(W-36);e.y=-36;e.vy=(130+wave*8)*sm;e.score=10; }
    else if(type==='weaver'){ e.w=34;e.h=34;e.hp=1;e.x=Math.random()*(W-34);e.y=-34;e.vy=(100+wave*6)*sm;e.amp=70;e.freq=1.6+Math.random();e.phase=Math.random()*6.28;e.t=0;e.score=15; }
    else if(type==='drone'){
      // 自爆无人机：冲下来接近玩家时爆炸（无子弹，靠近才危险）
      e.w=30;e.h=30;e.hp=1;
      e.x=Math.random()*(W-30);e.y=-30;
      e.vy=(150+wave*10)*sm;
      e.score=20;
    }
    else if(type==='turret'){
      // 炮塔：慢速下行，到一定高度后停下开火一段时间再走
      e.w=48;e.h=44;e.hp=3;
      e.x=Math.random()*(W-48);e.y=-44;
      e.vy=(70+wave*5)*sm;
      e.fireCd=1.5;e.stopped=false;
      e.score=30;
    }
    else if(type==='shielded'){
      // 护盾机：外有一圈护盾（先破盾再破身），盾在时会旋转
      e.w=44;e.h=40;e.hp=2;e.shieldHp=3;
      e.x=Math.random()*(W-44);e.y=-44;
      e.vy=(85+wave*5)*sm;
      e.spin=0;
      e.score=35;
    }
    else { e.w=64;e.h=56;e.hp=4;e.x=W/2-32+(Math.random()-.5)*140;e.y=-56;e.vy=(46+wave*4)*sm;e.score=40; }
    enemies.push(e);
  }

  // ---- Boss ----
  function spawnBoss(){
    boss = {
      type:'boss',
      w:160, h:110,
      x:W/2-80, y:-130,
      hp:40+wave*8,
      maxHp:40+wave*8,
      vy:0,
      phase:0,          // 0=入场,1=攻击,2=狂暴
      t:0,
      fireCd:0,
      speedMul:1,
      score:500,
      entered:false,
      enraged:false,
    };
    ebullets=[];        // 清屏敌弹，给玩家喘息
  }
  function updateBoss(dt){
    if(!boss) return;
    const b=boss;
    b.t+=dt;
    if(!b.entered){
      // 入场：从顶部下到 y=120
      b.y += 60*dt;
      if(b.y>=120){ b.y=120; b.entered=true; }
      return;
    }
    // 横向往返
    const speedMul = b.enraged ? 1.6 : 1;
    b.x += Math.cos(b.t*0.8)*120*speedMul*dt;
    b.x = Math.max(10, Math.min(W-b.w-10, b.x));
    // 切换狂暴（HP 低于 30%）
    if(!b.enraged && b.hp<b.maxHp*0.3){ b.enraged=true; boom(b.x+b.w/2,b.y+b.h/2,'#ff5c5c',40,400); tone(200,.4,'sawtooth',.08); }

    b.fireCd-=dt;
    if(b.fireCd<=0){
      const cx=b.x+b.w/2, cy=b.y+b.h;
      if(!b.enraged){
        // 三向扇形弹幕
        for(let a=-2;a<=2;a++){
          const ang=Math.PI/2 + a*0.35;
          ebullets.push({x:cx,y:cy,w:10,h:14,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300});
        }
        b.fireCd=0.9/b.speedMul;
      } else {
        // 狂暴：环形 + 高速直弹
        for(let i=0;i<10;i++){
          const ang=i/10*6.283 + b.t;
          ebullets.push({x:cx,y:cy,w:10,h:14,vx:Math.cos(ang)*340,vy:Math.sin(ang)*340});
        }
        ebullets.push({x:cx-40,y:cy,w:10,h:14,vx:0,vy:520});
        ebullets.push({x:cx+30,y:cy,w:10,h:14,vx:0,vy:520});
        b.fireCd=0.55;
      }
    }
    b.phase = Math.floor(b.t/6)%2;   // 每 6 秒切换攻击模式（非狂暴）
  }
  function bossHit(){
    if(!boss) return;
    boss.hp-=1;
    if(boss.hp<=0){
      score+=boss.score;
      boom(boss.x+boss.w/2,boss.y+boss.h/2,'#ffd479',80,500);
      boom(boss.x+boss.w/2,boss.y+boss.h/2,'#ff7a4d',60,420);
      tone(100,.6,'sawtooth',.09);
      // Boss 掉一个大道具
      items.push({type:'powerup',w:32,h:32,x:boss.x+boss.w/2-16,y:boss.y+boss.h/2,vy:90,spin:0});
      items.push({type:'heal',w:32,h:32,x:boss.x+boss.w/2-40,y:boss.y+boss.h/2,vy:90,spin:0});
      boss=null;
      setHud();
    }
  }
  function drawBoss(){
    if(!boss) return;
    const b=boss, cx=b.x+b.w/2, cy=b.y+b.h/2;
    ctx.save();
    // 主体
    ctx.shadowColor='#ff5c5c'; ctx.shadowBlur=b.enraged?30:18;
    ctx.fillStyle=b.enraged?'#8a1a1a':'#5a2050';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur=0;
    // 上层装甲
    ctx.fillStyle=b.enraged?'#ff5c5c':'#b06dff';
    ctx.fillRect(b.x+10, b.y+10, b.w-20, b.h*0.4);
    // 核心（会随血量变色）
    const coreCol = b.hp>b.maxHp*0.5?'#7ae0ff':(b.hp>b.maxHp*0.3?'#ffd479':'#ff5c5c');
    ctx.fillStyle=coreCol;
    ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 6.28); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 6.28); ctx.fill();
    // 两侧炮口
    ctx.fillStyle='#3a3a5a';
    ctx.fillRect(b.x-6, b.y+b.h*0.3, 12, 24);
    ctx.fillRect(b.x+b.w-6, b.y+b.h*0.3, 12, 24);
    ctx.restore();
    // 血条
    const bw=140, bx=cx-bw/2, by=b.y-14;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(bx,by,bw,8);
    ctx.fillStyle=b.hp>b.maxHp*0.3?'#ff5c7a':'#ffd479';
    ctx.fillRect(bx,by,bw*(b.hp/b.maxHp),8);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.strokeRect(bx,by,bw,8);
    // 狂暴提示
    if(b.enraged){
      ctx.fillStyle='#ffd479'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('狂暴模式', cx, by-4);
    }
  }
  function boom(x,y,color,n,spd){
    n=n||14; spd=spd||260;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=60+Math.random()*spd;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.4+Math.random()*.5,max:.9,color,s:2+Math.random()*3});
    }
  }
  function fire(){
    if(player.cd>0) return;
    player.cd=P.fireCd;
    const cx=player.x+P.w/2, top=player.y-8;
    // 等级 1：双管
    bullets.push({x:cx-14,y:top,w:6,h:18,v:P.bulletSpeed});
    bullets.push({x:cx+8, y:top,w:6,h:18,v:P.bulletSpeed});
    // 等级 2：加两发斜向
    if(fireLevel>=2){
      bullets.push({x:cx-22,y:top+14,w:5,h:16,v:P.bulletSpeed,vx:-90});
      bullets.push({x:cx+16,y:top+14,w:5,h:16,v:P.bulletSpeed,vx:90});
    }
    // 等级 3：加一发正中间厚弹
    if(fireLevel>=3){
      bullets.push({x:cx-3,y:top-14,w:6,h:24,v:P.bulletSpeed*1.05});
    }
    tone(760,.05,'square',.02);
  }
  function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  // ---- 道具（test-items 分支）----
  const ITEM_TYPES = ['powerup','heal','shield'];
  function spawnItem(){
    const type = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
    const it = { type, w:32, h:32, x:Math.random()*(W-32), y:-32, vy:90, spin:0 };
    items.push(it);
  }
  function applyItem(it){
    boom(it.x+16,it.y+16,'#ffe08a',16,200);
    if(it.type==='powerup'){
      fireLevel=Math.min(3,fireLevel+1);
      tone(880,.12,'sine',.06);
    } else if(it.type==='heal'){
      player.livesLeft=Math.min(P.lives,player.livesLeft+1);
      updateLives();
      tone(520,.12,'sine',.06);
    } else if(it.type==='shield'){
      shieldT=6;
      tone(660,.15,'sine',.06);
    }
  }

  // ---- 主循环 ----
  let lastT=0;
  function frame(t){
    requestAnimationFrame(frame);
    if(state==='idle'||state==='paused'){ lastT=t; draw(); return; }
    const dt=Math.min(.05,(t-lastT)/1000||.016);
    lastT=t;
    if(state==='running') update(dt);
    draw();
  }

  function update(dt){
    elapsed+=dt;
    for(const s of stars){ s.y+=s.v*dt; if(s.y>H){ s.y=-4; s.x=Math.random()*W; } }
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }

    // 玩家移动
    let tx=0,ty=0;
    if(keys['a']||keys['arrowleft']) tx-=1;
    if(keys['d']||keys['arrowright']) tx+=1;
    if(keys['w']||keys['arrowup']) ty-=1;
    if(keys['s']||keys['arrowdown']) ty+=1;
    const L=Math.hypot(tx,ty); if(L>0){ tx/=L; ty/=L; }
    player.x+=tx*P.speed*dt; player.y+=ty*P.speed*dt;
    player.x=Math.max(4,Math.min(W-P.w-4,player.x));
    player.y=Math.max(80,Math.min(H-P.h-30,player.y));
    player.angle=tx*.26;
    if(player.cd>0) player.cd-=dt;
    if(player.inv>0) player.inv-=dt;
    if(keys[' ']||mouseDown) fire();

    // 玩家子弹
    for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.y-=b.v*dt; if(b.vx){ b.x+=b.vx*dt; } if(b.y+b.h<0) bullets.splice(i,1); }
    // 敌弹
    for(let i=ebullets.length-1;i>=0;i--){ const b=ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>H+12||b.x<-12||b.x>W+12) ebullets.splice(i,1); }

    // 道具掉落（计时器驱动）
    itemCd-=dt;
    if(itemCd<=0){
      spawnItem();
      itemCd=7+Math.random()*4;
    }
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.y+=it.vy*dt;
      it.spin+=dt*3;
      if(it.y>H+30){ items.splice(i,1); continue; }
      if(hit(player, it)) { applyItem(it); items.splice(i,1); }
    }

    // 护盾倒计时
    if(shieldT>0){ shieldT-=dt; }

    // 敌机
    spawnCd-=dt;
    const isBossWave = bossPendingWave>0 && wave>=bossPendingWave;
    if(!isBossWave && spawnCd<=0){ spawnEnemy(); spawnCd=Math.max(.4,1.2/(1+(wave-1)*.3)); }
    // 每 3 波刷一个 Boss
    if(!boss && wave%3===0 && waveTimer<=1.5){
      bossPendingWave=wave;
      spawnBoss();
    }
    updateBoss(dt);
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.y+=e.vy*dt;
      if(e.type==='weaver'){ e.t+=dt; e.x=Math.max(0,Math.min(W-e.w,e.x+Math.cos(e.t*e.freq+e.phase)*e.amp*dt*3.2)); }
      if(e.type==='drone'){
        // 自爆：靠近玩家时加速俯冲
        const dx=(player.x+P.w/2)-(e.x+e.w/2), dy=(player.y+P.h/2)-(e.y+e.h/2);
        const d=Math.hypot(dx,dy);
        if(d<220){ e.vy+=200*dt; }
      }
      if(e.type==='turret'){
        if(!e.stopped && e.y>200){ e.stopped=true; e.vy=0; }
        e.fireCd-=dt;
        if(e.stopped&&e.fireCd<=0){
          const cx=e.x+e.w/2;
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:0,vy:360});
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:-160,vy:300});
          ebullets.push({x:cx-3,y:e.y+e.h,w:6,h:12,vx:160,vy:300});
          e.fireCd=1.4;
        }
        if(e.stopped&&e.y>H*.55){ e.vy=(60+wave*4); }  // 下够了就离开
      }
      if(e.type==='shielded'){ e.spin+=dt*1.5; }
      if(e.type==='tank'&&e.y>240&&e.y<H*.6&&Math.random()<.02){
        const cx=e.x+e.w/2;
        ebullets.push({x:cx-4,y:e.y+e.h,w:8,h:12,vx:0,vy:330});
        ebullets.push({x:cx-20,y:e.y+e.h,w:8,h:12,vx:-130,vy:280});
        ebullets.push({x:cx+12,y:e.y+e.h,w:8,h:12,vx:130,vy:280});
      }
      if(e.y>H+90){ enemies.splice(i,1); continue; }
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(hit(b,e)){
          bullets.splice(j,1);
          // 护盾机：先破盾
          if(e.type==='shielded'&&e.shieldHp>0){
            e.shieldHp-=1;
            boom(b.x+b.w/2,b.y+b.h/2,'#6fd8ff',4,120);
            continue;
          }
          e.hp-=1;
          boom(e.x+e.w/2,e.y+e.h/2,'#ffd479',5,160);
          if(e.hp<=0){
            score+=e.score;
            const col = e.type==='tank'?'#c98bff':(e.type==='drone'?'#ff8a4d':(e.type==='shielded'?'#6fd8ff':'#9fe0ff'));
            boom(e.x+e.w/2,e.y+e.h/2,col,e.type==='tank'?28:15,300);
            if(e.type==='drone'){ boom(e.x+e.w/2,e.y+e.h/2,'#ff5c5c',30,360); }  // 自爆特效
            tone(400,.09,'sawtooth',.04);
            enemies.splice(i,1); setHud();
          }
          break;
        }
      }
      if(enemies[i]===e&&player.inv<=0&&hit(player,e)){
        if(e.type==='drone'){
          // 自爆无人机撞到玩家 = 立即爆炸扣血
          boom(e.x+e.w/2,e.y+e.h/2,'#ff5c5c',34,380);
          enemies.splice(i,1);
        }
        playerHit();
      }
    }
    // Boss 碰撞
    if(boss&&player.inv<=0&&hit(player,boss)){
      playerHit();
    }
    // 玩家子弹 vs Boss
    if(boss){
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(hit(b,boss)){
          bullets.splice(j,1);
          boom(b.x+b.w/2,b.y+b.h/2,'#ffd479',4,140);
          bossHit();
          break;
        }
      }
    }
    if(player.inv<=0){
      for(let i=ebullets.length-1;i>=0;i--){
        const b=ebullets[i];
        if(hit(b,player)){ ebullets.splice(i,1); playerHit(); break; }
      }
    }
    waveTimer-=dt;
    if(waveTimer<=0){ wave++; waveTimer=20; spawnCd=.2; setHud(); }
  }

  function playerHit(){
    // 护盾抵挡：不扣血，只清掉周围敌弹并短闪
    if(shieldT>0){
      // 清除附近敌弹，给个护盾破碎效果
      for(let i=ebullets.length-1;i>=0;i--){
        const b=ebullets[i];
        if(Math.hypot(b.x-player.x,b.y-player.y)<110) ebullets.splice(i,1);
      }
      boom(player.x+P.w/2,player.y+P.h/2,'#7ae0ff',22,260);
      tone(1200,.1,'sine',.05);
      shieldT=Math.max(0,shieldT-1.2);   // 每次抵挡消耗护盾
      player.inv=Math.max(player.inv,.5);
      return;
    }
    player.livesLeft--;
    player.inv=P.invincible;
    hitFlash=.22;
    boom(player.x+P.w/2,player.y+P.h/2,'#ff5c7a',34,360);
    tone(120,.25,'sawtooth',.06);
    updateLives();
    if(player.livesLeft<=0) gameOver();
  }
  function gameOver(){
    state='over';
    if(score>hiscore){ hiscore=score; localStorage.setItem('tf.hiscore',hiscore); }
    document.getElementById('hiscore').textContent=hiscore;
    showOverlay('over');
  }

  // ---- 覆盖层 ----
  function showOverlay(kind){
    const ov=document.getElementById('overlay'), title=document.getElementById('ovTitle');
    const scoreEl=document.getElementById('ovScore'), scoreVal=document.getElementById('ovScoreVal');
    ov.classList.add('show');
    if(kind==='over'){ title.textContent='游戏结束'; scoreEl.style.display='block'; scoreVal.textContent=score; document.getElementById('startBtn').textContent='再 来 一 局'; }
    else { title.textContent='雷霆战机'; scoreEl.style.display='none'; document.getElementById('startBtn').textContent='开 始 游 戏'; }
  }
  function startGame(){
    initAudio();
    resetGame();
    updateLives();
    setHud();
    document.getElementById('overlay').classList.remove('show');
    state='running';
  }

  // ---- 绘制 ----
  function draw(){
    ctx.fillStyle='#04060f'; ctx.fillRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=s.b; ctx.fillStyle='#bfe0ff'; ctx.fillRect(s.x,s.y,s.s,s.s*1.7); }
    ctx.globalAlpha=1;
    for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.s,p.s); }
    ctx.globalAlpha=1;
    for(const b of bullets){ ctx.fillStyle='#b6f6ff'; ctx.shadowColor='#3aa0ff'; ctx.shadowBlur=10; ctx.fillRect(b.x,b.y,b.w,b.h); }
    ctx.shadowBlur=0;
    for(const b of ebullets){ ctx.fillStyle='#ff7a9a'; ctx.shadowColor='#ff5c7a'; ctx.shadowBlur=7; ctx.beginPath(); ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,6.28); ctx.fill(); }
    ctx.shadowBlur=0;
    for(const e of enemies) drawEnemy(e);
    drawBoss();

    // 道具
    for(const it of items) drawItem(it);

    // 玩家：画在最上层，带发光（已验证可见）
    if(state!=='over'&&player) drawPlayer();

    // 护盾环
    if(state!=='over'&&shieldT>0&&player){
      const cx=player.x+P.w/2, cy=player.y+P.h/2;
      const pulse = 1+Math.sin(elapsed*6)*.06;
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = shieldT>2 ? 'rgba(122,224,255,.9)' : 'rgba(255,160,90,.9)';
      ctx.lineWidth = 3;
      ctx.shadowColor = shieldT>2 ? '#7ae0ff' : '#ffa05a';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(cx, cy, 52*pulse, 0, 6.28);
      ctx.stroke();
      ctx.restore();
    }

    if(hitFlash>0){ ctx.fillStyle='rgba(255,60,90,'+(hitFlash*.35)+')'; ctx.fillRect(0,0,W,H); hitFlash=Math.max(0,hitFlash-.02); }
  }

  function drawItem(it){
    const cx=it.x+16, cy=it.y+16;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(it.spin*0.4);
    const cols = { powerup:['#ffd24d','#a86a00','P'], heal:['#ff6f8f','#8a1f35','+'], shield:['#6fd8ff','#0f5a8a','S'] };
    const c = cols[it.type];
    ctx.shadowColor=c[0]; ctx.shadowBlur=14;
    ctx.fillStyle=c[0];
    ctx.beginPath();
    // 旋转的六边形
    for(let i=0;i<6;i++){
      const a=i/6*6.283 - Math.PI/2;
      const r=16;
      if(i===0) ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#0b1220';
    ctx.font='bold 16px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c[2],0,1);
    ctx.restore();
  }

  function drawPlayer(){
    const p=player, cx=p.x+P.w/2, cy=p.y+P.h/2;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.inv>0 && Math.floor(elapsed*10)%2===0 ? .45 : 1;
    // 尾焰
    ctx.fillStyle='rgba(120,200,255,.45)';
    ctx.beginPath(); ctx.ellipse(0,P.h/2+12,7,14,0,0,6.28); ctx.fill();
    // 光晕 + 机翼
    ctx.shadowColor='#63c8ff'; ctx.shadowBlur=22;
    ctx.fillStyle='#2f8fe8';
    ctx.beginPath();
    ctx.moveTo(-P.w/2,P.h/2-4);
    ctx.lineTo(-P.w/2*.55,-P.h/2*.25);
    ctx.lineTo(-P.w/2*.18,-P.h/2);
    ctx.lineTo(0,-P.h*.35);
    ctx.lineTo(P.w/2*.18,-P.h/2);
    ctx.lineTo(P.w/2*.55,-P.h/2*.25);
    ctx.lineTo(P.w/2,P.h/2-4);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // 高光
    ctx.fillStyle='#7fd0ff';
    ctx.beginPath(); ctx.moveTo(0,-P.h/2+4); ctx.lineTo(8,6); ctx.lineTo(-8,6); ctx.closePath(); ctx.fill();
    // 座舱
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,-4,5,0,6.28); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }

  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x+e.w/2,e.y+e.h/2);
    if(e.type==='grunt'){
      ctx.fillStyle='#ff5c7a';
      ctx.beginPath();
      ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,-e.h/2*.4); ctx.lineTo(e.w/2*.4,-e.h/2);
      ctx.lineTo(-e.w/2*.4,-e.h/2); ctx.lineTo(-e.w/2,-e.h/2*.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd0da'; ctx.beginPath(); ctx.arc(0,-2,4,0,6.28); ctx.fill();
    } else if(e.type==='weaver'){
      ctx.fillStyle='#ff9d4d';
      ctx.beginPath(); ctx.moveTo(0,e.h/2); ctx.lineTo(e.w/2,0); ctx.lineTo(0,-e.h/2); ctx.lineTo(-e.w/2,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffe4c4'; ctx.beginPath(); ctx.arc(0,0,3.5,0,6.28); ctx.fill();
    } else if(e.type==='drone'){
      // 自爆无人机：红橙闪烁 + 引信
      const blink = Math.floor(elapsed*10)%2===0;
      ctx.fillStyle=blink?'#ff3a3a':'#ff8a4d';
      ctx.beginPath(); ctx.arc(0,0,15,0,6.28); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill();
      // 四角刺
      ctx.strokeStyle='#ff5c5c'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const a=i/4*6.283+elapsed*4;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*15,Math.sin(a)*15); ctx.lineTo(Math.cos(a)*22,Math.sin(a)*22); ctx.stroke();
      }
    } else if(e.type==='turret'){
      // 炮塔：方形 + 旋转炮管
      ctx.fillStyle='#5a6a8a';
      ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
      ctx.fillStyle='#8a9aba';
      ctx.fillRect(-e.w/2+6,-e.h/2+6,e.w-12,e.h-12);
      ctx.save();
      ctx.rotate(elapsed*2);
      ctx.fillStyle='#3a4a6a';
      ctx.fillRect(-4,-e.h/2-4,8,20);
      ctx.restore();
      ctx.fillStyle='#ff5c7a'; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill();
    } else if(e.type==='shielded'){
      // 护盾机：紫色机身 + 旋转护盾圈
      ctx.fillStyle='#8a5aff';
      ctx.beginPath(); ctx.arc(0,0,16,0,6.28); ctx.fill();
      ctx.fillStyle='#c9b8ff'; ctx.beginPath(); ctx.arc(0,0,8,0,6.28); ctx.fill();
      if(e.shieldHp>0){
        ctx.save();
        ctx.rotate(e.spin);
        ctx.strokeStyle='rgba(111,216,255,.9)';
        ctx.lineWidth=3;
        ctx.shadowColor='#6fd8ff'; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(0,0,24,0.4,2.4); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,24,0.4+3.14,2.4+3.14); ctx.stroke();
        ctx.restore();
      }
    } else { // tank
      ctx.fillStyle='#b06dff'; ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h*.7);
      ctx.fillStyle='#7a3cff'; ctx.fillRect(-e.w/2,e.h*.2,e.w,e.h*.3);
      for(let i=0;i<e.hp;i++){ ctx.fillStyle='#d9b8ff'; ctx.fillRect(-e.w/2+6+i*12,e.h/2-8,8,4); }
    }
    ctx.restore();
  }

  // ---- 输入 ----
  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
    if(k==='p'&&state==='running'){ state='paused'; showOverlay('pause'); return; }
    if(k==='p'&&state==='paused'){ state='running'; document.getElementById('overlay').classList.remove('show'); return; }
    if(k==='m'){ muted=!muted; return; }
    keys[k]=true;
  });
  document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  function pointerMove(e){
    if(state!=='running'&&state!=='idle') return;
    const r=cvs.getBoundingClientRect(), s=W/r.width;
    const pt=e.touches?e.touches[0]:e;
    player.x=(pt.clientX-r.left)*s-P.w/2;
    player.y=(pt.clientY-r.top)*s-P.h/2;
    player.x=Math.max(4,Math.min(W-P.w-4,player.x));
    player.y=Math.max(80,Math.min(H-P.h-30,player.y));
  }
  cvs.addEventListener('mousemove',pointerMove);
  cvs.addEventListener('touchmove',e=>{ e.preventDefault(); pointerMove(e); },{passive:false});
  // 鼠标长按：按住持续射击（主版本需求）
  cvs.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    mouseDown = true;
    if(state==='running') fire();   // 立刻射一发，避免首次延迟
  });
  document.addEventListener('mouseup',e=>{ if(e.button===0) mouseDown = false; });
  cvs.addEventListener('mouseleave',()=>{ mouseDown = false; });
  // 触屏长按
  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();
    mouseDown = true;
    if(state==='running') fire();
    pointerMove(e);
  },{passive:false});
  document.addEventListener('touchend',e=>{ if(e.type==='touchend'||!e.touches.length) mouseDown=false; });

  document.getElementById('startBtn').addEventListener('click',startGame);
  window.addEventListener('resize',()=>{});

  // ---- 启动 ----
  resetGame();
  updateLives();
  setHud();
  showOverlay('start');
  requestAnimationFrame(frame);
})();
</script>
